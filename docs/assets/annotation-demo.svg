<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic native annotation geometry demo</title>
  <desc id="desc">A fictional paper page with a green highlight, coordinate labels, and an annotation comment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11192b"/><stop offset="1" stop-color="#263c63"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="90" y="95" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Native geometry, not a screenshot</text>
  <text x="90" y="140" fill="#aebee5" font-family="Arial, sans-serif" font-size="23">synthetic PDF page · fictional text · exact rectangles</text>
  <g filter="url(#shadow)"><rect x="170" y="205" width="880" height="670" rx="10" fill="#fffdf6"/><rect x="220" y="260" width="560" height="26" rx="5" fill="#d7dce5"/><rect x="220" y="326" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="365" width="730" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="404" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="443" width="680" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="482" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="521" width="510" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="560" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="599" width="740" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="638" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="677" width="640" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="716" width="770" height="18" rx="4" fill="#dfe3e9"/><rect x="220" y="755" width="560" height="18" rx="4" fill="#dfe3e9"/>
    <rect x="345" y="396" width="520" height="34" rx="5" fill="#5fb236" opacity=".55"/><text x="355" y="421" fill="#24341d" font-family="Arial, sans-serif" font-size="21">a reproducible synthetic highlight</text></g>
  <g font-family="Arial, sans-serif"><rect x="1130" y="270" width="340" height="210" rx="20" fill="#f2f6ff"/><text x="1170" y="325" fill="#283b73" font-size="22" font-weight="700">Annotation</text><text x="1170" y="368" fill="#425478" font-size="19">pageIndex: 0</text><text x="1170" y="402" fill="#425478" font-size="19">rects: [x1,y1,x2,y2]</text><text x="1170" y="436" fill="#425478" font-size="19">sortIndex: native</text><path d="M1130 410 L900 420" stroke="#9db2e8" stroke-width="3" fill="none"/></g>
  <text x="170" y="935" fill="#d4e0ff" font-family="Arial, sans-serif" font-size="23">The visual is illustrative; no real paper, quote, item, or library data is included.</text>
</svg>
